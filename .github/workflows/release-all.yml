name: Release All

on:
  workflow_dispatch:

permissions:
  actions: write # Required to trigger workflow_dispatch on the release-*.yml workflows
  contents: read

jobs:
  trigger-all:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in \
            release-client-sdk.yml \
            release-nextjs-sdk.yml \
            release-nuxt-sdk.yml \
            release-openfeature-server.yml \
            release-openfeature-web.yml \
            release-react-native-sdk.yml \
            release-react-web-sdk.yml \
            release-server-sdk.yml \
            release-vue-sdk.yml; do
            echo "Triggering $workflow on ${{ github.ref_name }}"
            gh workflow run "$workflow" --ref "${{ github.ref_name }}"
          done
