name: js-sdks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: yarn install
        run: yarn install

      - name: yarn playwright install
        run: yarn playwright install --with-deps
        working-directory: ./packages/js-client-core

      - name: yarn build
        run: yarn build

      - name: yarn lint
        run: yarn lint

      - name: yarn test
        run: yarn test

  nuxt3-compat:
    name: Nuxt SDK — Nuxt 3 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: yarn install
        run: yarn install

      - name: Override nuxt-sdk deps to Nuxt 3
        run: |
          yarn workspace @configdirector/nuxt-sdk add "@nuxt/kit@^3"
          yarn workspace @configdirector/nuxt-sdk add --dev "nuxt@^3" "@nuxt/schema@^3" "@nuxt/test-utils@^3"

      - name: Generate Nuxt types
        run: yarn workspace @configdirector/nuxt-sdk exec nuxt prepare

      - name: yarn playwright install
        run: yarn playwright install --with-deps
        working-directory: ./packages/nuxt-sdk

      - name: Run nuxt-sdk tests against Nuxt 3
        run: yarn workspace @configdirector/nuxt-sdk ci:test
